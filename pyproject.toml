[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vnmpc"
version = "0.1.0"
description = "Real-time nonlinear MPC for a car at the handling limit (acados), with a linear MPC baseline (OSQP), timing benchmarks, data-certified grip (ddma) and ROS 2 C++ nodes."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Anas Makdesi" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "casadi>=3.6", "osqp>=1.0", "matplotlib>=3.7"]

[project.optional-dependencies]
grip = ["ddma @ git+https://github.com/anas-makdesi/ddma@v0.12.0"]
dev = ["pytest>=7", "ruff>=0.4"]
# acados_template is installed from the acados source tree (see README)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E702", "E731"]
